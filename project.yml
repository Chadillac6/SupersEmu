name: SupersEmu
options:
  bundleIdPrefix: com.chadillac6.supersemu
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
# Signing (team from SUPERSEMU_TEAM_ID; unsigned when unset): see docs/specs/distribution.md.
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    CLANG_CXX_LANGUAGE_STANDARD: gnu++17
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  SupersEmuServer:
    path: Server

x-core-settings: &core_settings
  GCC_OPTIMIZATION_LEVEL: "3"
  GCC_WARN_INHIBIT_ALL_WARNINGS: YES
  CLANG_ENABLE_OBJC_ARC: NO
  GENERATE_MASTER_OBJECT_FILE: YES
  PRELINK_FLAGS: "-exported_symbols_list $(SRCROOT)/Host/CoreEntry/core.exports"
  SKIP_INSTALL: YES

targets:
  # libretro cores. Each is a static library prelinked into one object that exports only
  # se_core_<id>() (Host/CoreEntry), so the cores' identical retro_* symbols never collide.
  # Pinned commits: scripts/pin-cores.sh. Licences: docs/specs/core-matrix.md.
  Snes9xCore:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=snes9x", "-DSE_CORE_REVISION=fae2fea", "-DSE_CORE_CHEAT_COUNT=se_snes9x_cheat_count"]
      - path: Host/CoreEntry/snes9x/se_cheats.cpp
      - path: Vendor/cores/snes9x
        includes:
          - "apu/apu.cpp"
          - "apu/bapu/dsp/sdsp.cpp"
          - "apu/bapu/smp/smp.cpp"
          - "apu/bapu/smp/smp_state.cpp"
          - "c4emu.c"
          - "msu1.c"
          - "zipfile.c"
          - "srtc.c"
          - "obc1.c"
          - "bsflash.c"
          - "tile.c"
          - "bsx.c"
          - "spc7110.c"
          - "fxemu.c"
          - "sdd1.c"
          - "seta.c"
          - "sa1hw.c"
          - "dsp.c"
          - "filter/snes_ntsc.c"
          - "cheats2.cpp"
          - "clip.cpp"
          - "controls.cpp"
          - "cpu.cpp"
          - "cpuexec.cpp"
          - "cpuops.cpp"
          - "crosshairs.cpp"
          - "dma.cpp"
          - "gfx.cpp"
          - "globals.cpp"
          - "loadzip.cpp"
          - "memmap.cpp"
          - "ppu.cpp"
          - "sa1.cpp"
          - "sa1cpu.cpp"
          - "snapshot.cpp"
          - "sha256.cpp"
          - "bml.cpp"
          - "fscompat.cpp"
          - "libretro/libretro.cpp"
          - "libretro/libretro-common/compat/compat_posix_string.c"
          - "libretro/libretro-common/compat/compat_strcasestr.c"
          - "libretro/libretro-common/compat/compat_snprintf.c"
          - "libretro/libretro-common/compat/compat_strl.c"
          - "libretro/libretro-common/compat/fopen_utf8.c"
          - "libretro/libretro-common/encodings/encoding_utf.c"
          - "libretro/libretro-common/encodings/encoding_deflate.c"
          - "libretro/libretro-common/file/file_path.c"
          - "libretro/libretro-common/file/file_path_io.c"
          - "libretro/libretro-common/streams/file_stream.c"
          - "libretro/libretro-common/streams/file_stream_transforms.c"
          - "libretro/libretro-common/string/stdstring.c"
          - "libretro/libretro-common/time/rtime.c"
          - "libretro/libretro-common/vfs/vfs_implementation.c"
          - "libretro/libretro-common/vfs/vfs_hybrid.c"
          - "libretro/libretro-common/file/retro_dirent.c"
    settings:
      base:
        <<: *core_settings
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "ALLOW_CPU_OVERCLOCK", "HAVE_STRINGS_H"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/cores/snes9x"
          - "$(SRCROOT)/Vendor/cores/snes9x/libretro"
          - "$(SRCROOT)/Vendor/cores/snes9x/libretro/libretro-common/include"
          - "$(SRCROOT)/Vendor/cores/snes9x/apu"
          - "$(SRCROOT)/Vendor/cores/snes9x/apu/bapu"
          - "$(SRCROOT)/Host/CoreEntry"
        GCC_ENABLE_CPP_RTTI: NO
        GCC_ENABLE_CPP_EXCEPTIONS: NO

  GambatteCore:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=gambatte", "-DSE_CORE_REVISION=d9d6cd0", "-DSE_CORE_CHEATS=1"]
      - path: Vendor/cores/gambatte/libgambatte
        includes:
          - "src/*.cpp"
          - "src/mem/*.cpp"
          - "src/sound/*.cpp"
          - "src/video/*.cpp"
          - "libretro/gambatte_log.c"
          - "libretro/blipper.c"
          - "libretro/cc_resampler.c"
          - "libretro/libretro.cpp"
          - "libretro-common/compat/*.c"
          - "libretro-common/encodings/encoding_utf.c"
          - "libretro-common/file/file_path.c"
          - "libretro-common/file/file_path_io.c"
          - "libretro-common/streams/*.c"
          - "libretro-common/string/stdstring.c"
          - "libretro-common/time/rtime.c"
          - "libretro-common/vfs/vfs_implementation.c"
    settings:
      base:
        <<: *core_settings
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "HAVE_STDINT_H", "HAVE_INTTYPES_H", "VIDEO_RGB565"]
        # GB::saveState serialises a stack SaveState whose unused fields are otherwise
        # uninitialised, which makes save states differ run to run.
        OTHER_CFLAGS: ["-ftrivial-auto-var-init=zero"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/cores/gambatte/libgambatte/src"
          - "$(SRCROOT)/Vendor/cores/gambatte/libgambatte/include"
          - "$(SRCROOT)/Vendor/cores/gambatte/common"
          - "$(SRCROOT)/Vendor/cores/gambatte/common/resample"
          - "$(SRCROOT)/Vendor/cores/gambatte/libgambatte/libretro"
          - "$(SRCROOT)/Vendor/cores/gambatte/libgambatte/libretro-common/include"
          - "$(SRCROOT)/Host/CoreEntry"

  MGBACore:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=mgba", "-DSE_CORE_REVISION=7a12d6d", "-DSE_CORE_CHEATS=1"]
      - path: Host/CoreEntry/mgba/version.c
      - path: Vendor/cores/mgba/src
        includes:
          - "arm/*.c"
          - "sm83/*.c"
          - "core/*.c"
          - "gb/*.c"
          - "gb/mbc/*.c"
          - "gb/renderers/*.c"
          - "gba/*.c"
          - "gba/cart/*.c"
          - "gba/cheats/*.c"
          - "gba/renderers/*.c"
          - "gba/sio/gbp.c"
          - "platform/libretro/*.c"
          - "third-party/inih/ini.c"
          - "util/*.c"
          - "util/image/*.c"
          - "util/vfs/vfs-dirent.c"
          - "util/vfs/vfs-fd.c"
          - "util/vfs/vfs-fifo.c"
          - "util/vfs/vfs-mem.c"
        excludes:
          - "core/scripting.c"
          - "core/library.c"
          - "core/mem-search.c"
          - "core/rewind.c"
          - "core/input.c"
          - "util/audio-resampler.c"
          - "util/interpolator.c"
          - "**/*-test.c"
    settings:
      base:
        <<: *core_settings
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "_GNU_SOURCE", "_DARWIN_C_SOURCE", "COLOR_16_BIT", "COLOR_5_6_5", "DISABLE_THREADING", "MGBA_STANDALONE", "MINIMAL_CORE=2", "M_CORE_GB", "M_CORE_GBA", "ENABLE_VFS", "ENABLE_VFS_FD", "ENABLE_DIRECTORIES", "HAVE_FREELOCALE", "HAVE_FUTIMENS", "HAVE_FUTIMES", "HAVE_LOCALE", "HAVE_LOCALTIME_R", "HAVE_NEWLOCALE", "HAVE_REALPATH", "HAVE_SETLOCALE", "HAVE_SNPRINTF_L", "HAVE_STRDUP", "HAVE_STRLCPY", "HAVE_STRNDUP", "HAVE_STRTOF_L", "HAVE_USELOCALE", "HAVE_VASPRINTF", "HAVE_XLOCALE", "M_PI=3.14159265358979323846"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Host/CoreEntry/mgba"
          - "$(SRCROOT)/Vendor/cores/mgba/src"
          - "$(SRCROOT)/Vendor/cores/mgba/include"
          - "$(SRCROOT)/Vendor/cores/mgba/src/platform/libretro"
          - "$(SRCROOT)/Host/CoreEntry"

  GenesisPlusGXCore:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=genesis_plus_gx", "-DSE_CORE_REVISION=393f70c", "-DSE_CORE_LOAD_GAME=se_gpgx_load_game", "-DSE_CORE_CHEAT_COUNT=se_gpgx_cheat_count"]
      - path: Host/CoreEntry/genesis_plus_gx/se_load_game.c
      - path: Host/CoreEntry/genesis_plus_gx/se_libretro.c
      - path: Vendor/cores/genesis_plus_gx
        includes:
          - "core/*.c"
          - "core/z80/*.c"
          - "core/m68k/*.c"
          - "core/ntsc/*.c"
          - "core/sound/*.c"
          - "core/input_hw/*.c"
          - "core/cd_hw/*.c"
          - "core/cart_hw/*.c"
          - "core/cart_hw/svp/*.c"
          # libretro/libretro.c is compiled via Host/CoreEntry/genesis_plus_gx/se_libretro.c.
          - "libretro/libretro-common/streams/file_stream.c"
          - "libretro/libretro-common/streams/file_stream_transforms.c"
          - "libretro/libretro-common/compat/fopen_utf8.c"
          - "libretro/libretro-common/compat/compat_snprintf.c"
          - "libretro/libretro-common/compat/compat_strl.c"
          - "libretro/libretro-common/compat/compat_strcasestr.c"
          - "libretro/libretro-common/compat/compat_posix_string.c"
          - "libretro/libretro-common/encodings/encoding_utf.c"
          - "libretro/libretro-common/file/file_path.c"
          - "libretro/libretro-common/file/retro_dirent.c"
          - "libretro/libretro-common/lists/string_list.c"
          - "libretro/libretro-common/lists/dir_list.c"
          - "libretro/libretro-common/memmap/memalign.c"
          - "libretro/libretro-common/string/stdstring.c"
          - "libretro/libretro-common/vfs/vfs_implementation.c"
          # Sega CD: CHD images (libchdr) and OGG audio tracks (Tremor), as upstream Makefile.libretro.
          - "core/sound/tremor/*.c"
          - "libretro/deps/libchdr/src/*.c"
          - "libretro/deps/lzma-19.00/src/Alloc.c"
          - "libretro/deps/lzma-19.00/src/Bra86.c"
          - "libretro/deps/lzma-19.00/src/BraIA64.c"
          - "libretro/deps/lzma-19.00/src/CpuArch.c"
          - "libretro/deps/lzma-19.00/src/Delta.c"
          - "libretro/deps/lzma-19.00/src/LzFind.c"
          - "libretro/deps/lzma-19.00/src/Lzma86Dec.c"
          - "libretro/deps/lzma-19.00/src/LzmaDec.c"
          - "libretro/deps/lzma-19.00/src/LzmaEnc.c"
          - "libretro/deps/lzma-19.00/src/Sort.c"
          - "libretro/deps/zstd/lib/common/entropy_common.c"
          - "libretro/deps/zstd/lib/common/error_private.c"
          - "libretro/deps/zstd/lib/common/fse_decompress.c"
          - "libretro/deps/zstd/lib/common/zstd_common.c"
          - "libretro/deps/zstd/lib/common/xxhash.c"
          - "libretro/deps/zstd/lib/decompress/huf_decompress.c"
          - "libretro/deps/zstd/lib/decompress/zstd_ddict.c"
          - "libretro/deps/zstd/lib/decompress/zstd_decompress.c"
          - "libretro/deps/zstd/lib/decompress/zstd_decompress_block.c"
    settings:
      base:
        <<: *core_settings
        GCC_PREFIX_HEADER: Host/CoreEntry/genesis_plus_gx/prefix.h
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "LSB_FIRST", "BYTE_ORDER=LITTLE_ENDIAN", "HAVE_ZLIB", "USE_16BPP_RENDERING", "FRONTEND_SUPPORTS_RGB565", "USE_LIBRETRO_VFS", "M68K_OVERCLOCK_SHIFT=20", "Z80_OVERCLOCK_SHIFT=20", "HAVE_YM3438_CORE", "HAVE_OPLL_CORE", "USE_PER_SOUND_CHANNELS_CONFIG", "MAXROMSIZE=33554432", "USE_LIBCHDR", "USE_LIBTREMOR", "_7ZIP_ST", "ZSTD_DISABLE_ASM"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/z80"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/m68k"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/ntsc"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/sound"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/sound/minimp3"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/input_hw"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/cd_hw"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/cart_hw"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/core/cart_hw/svp"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/libretro"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/libretro/libretro-common/include"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/libretro/deps/libchdr/include"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/libretro/deps/lzma-19.00/include"
          - "$(SRCROOT)/Vendor/cores/genesis_plus_gx/libretro/deps/zstd/lib"
          - "$(SRCROOT)/Host/CoreEntry"

  # 32X (also runs Genesis/Sega CD, but SupersEmu uses it for 32X only). C interpreters only:
  # FAME 68k, CZ80, MAME SH-2; no Cyclone/DrZ80 ARM asm and no SH-2/SVP dynarec (iOS forbids JIT).
  PicoDriveCore:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=picodrive", "-DSE_CORE_REVISION=1890c29", "-DSE_CORE_CHEAT_COUNT=se_picodrive_cheat_count"]
      - path: Host/CoreEntry/picodrive/se_cheats.c
      - path: Vendor/cores/picodrive
        includes:
          - "pico/pico.c"
          - "pico/cart.c"
          - "pico/memory.c"
          - "pico/state.c"
          - "pico/sek.c"
          - "pico/z80if.c"
          - "pico/videoport.c"
          - "pico/draw2.c"
          - "pico/draw.c"
          - "pico/mode4.c"
          - "pico/misc.c"
          - "pico/eeprom.c"
          - "pico/patch.c"
          - "pico/debug.c"
          - "pico/media.c"
          - "pico/sms.c"
          - "pico/cd/mcd.c"
          - "pico/cd/memory.c"
          - "pico/cd/sek.c"
          - "pico/cd/cdc.c"
          - "pico/cd/cdd.c"
          - "pico/cd/cd_image.c"
          - "pico/cd/cd_parse.c"
          - "pico/cd/gfx.c"
          - "pico/cd/gfx_dma.c"
          - "pico/cd/misc.c"
          - "pico/cd/pcm.c"
          - "pico/cd/megasd.c"
          - "pico/32x/32x.c"
          - "pico/32x/memory.c"
          - "pico/32x/draw.c"
          - "pico/32x/sh2soc.c"
          - "pico/32x/pwm.c"
          - "pico/pico/pico.c"
          - "pico/pico/memory.c"
          - "pico/pico/xpcm.c"
          - "pico/carthw/carthw.c"
          - "pico/carthw/eeprom_spi.c"
          - "pico/carthw/svp/svp.c"
          - "pico/carthw/svp/memory.c"
          - "pico/carthw/svp/ssp16.c"
          - "pico/sound/sound.c"
          - "pico/sound/resampler.c"
          - "pico/sound/sn76496.c"
          - "pico/sound/ym2612.c"
          - "pico/sound/ym2413.c"
          - "pico/sound/vgm.c"
          - "pico/sound/mix.c"
          - "cpu/fame/famec.c"
          - "cpu/cz80/cz80.c"
          - "cpu/sh2/sh2.c"
          - "cpu/sh2/mame/sh2pico.c"
          - "platform/common/mp3.c"
          - "platform/common/mp3_sync.c"
          - "platform/common/mp3_drmp3.c"
          - "platform/common/ogg.c"
          - "platform/common/tremor/*.c"
          - "unzip/unzip.c"
          - "platform/libretro/libretro.c"
          - "platform/libretro/libretro-common/compat/compat_strcasestr.c"
          - "platform/libretro/libretro-common/compat/compat_strl.c"
          - "platform/libretro/libretro-common/compat/compat_posix_string.c"
          - "platform/libretro/libretro-common/compat/fopen_utf8.c"
          - "platform/libretro/libretro-common/encodings/encoding_utf.c"
          - "platform/libretro/libretro-common/file/file_path.c"
          - "platform/libretro/libretro-common/file/file_path_io.c"
          - "platform/libretro/libretro-common/formats/png/rpng.c"
          - "platform/libretro/libretro-common/memmap/memmap.c"
          - "platform/libretro/libretro-common/streams/file_stream.c"
          - "platform/libretro/libretro-common/streams/file_stream_transforms.c"
          - "platform/libretro/libretro-common/streams/trans_stream.c"
          - "platform/libretro/libretro-common/streams/trans_stream_pipe.c"
          - "platform/libretro/libretro-common/streams/trans_stream_zlib.c"
          - "platform/libretro/libretro-common/string/stdstring.c"
          - "platform/libretro/libretro-common/time/rtime.c"
          - "platform/libretro/libretro-common/vfs/vfs_implementation.c"
    settings:
      base:
        <<: *core_settings
        GCC_PREFIX_HEADER: Host/CoreEntry/picodrive/prefix.h
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "USE_LIBRETRO_VFS", "HAVE_ZLIB", "EMU_F68K", "_USE_CZ80", "USE_TREMOR", "UINT8=uint8_t", "UINT16=uint16_t", "UINT32=uint32_t", "INT8=int8_t", "INT16=int16_t", "INT32=int32_t"]
        OTHER_CFLAGS: ["-fno-strict-aliasing"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/cores/picodrive"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include/compat"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include/encodings"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include/formats"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include/streams"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include/string"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/libretro/libretro-common/include/vfs"
          - "$(SRCROOT)/Vendor/cores/picodrive/platform/common"
          # Tremor's <ogg/ogg.h> without putting tremor/ itself on the path: its block.h shadows the
          # SDK's <Block.h> on case-insensitive filesystems.
          - "$(SRCROOT)/Host/CoreEntry/picodrive/include"
          - "$(SRCROOT)/Vendor/cores/picodrive/pico/sound"
          - "$(SRCROOT)/Host/CoreEntry"

  # PlayStation. Software renderer only (no HAVE_HW / OpenGL / Vulkan) and no Lightrec dynarec
  # (HAVE_LIGHTREC unset): iOS forbids JIT. Source list = upstream Makefile.common for
  # `make platform=osx HAVE_LIGHTREC=0` (CHD, PBP, threaded CD reads).
  BeetlePSXCore:
    type: library.static
    platform: [iOS, macOS]
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=beetle_psx", "-DSE_CORE_REVISION=10e4b0c", "-DSE_CORE_CHEAT_COUNT=se_beetle_psx_cheat_count"]
      - path: Host/CoreEntry/beetle_psx/se_mempatcher.c
      - path: Vendor/cores/beetle_psx
        includes:
          - "input.c"
          - "input_compatibility.c"
          - "libretro-common/compat/compat_posix_string.c"
          - "libretro-common/compat/compat_strcasestr.c"
          - "libretro-common/compat/compat_strl.c"
          - "libretro-common/compat/fopen_utf8.c"
          - "libretro-common/encodings/encoding_crc32.c"
          - "libretro-common/encodings/encoding_deflate.c"
          - "libretro-common/encodings/encoding_huffman.c"
          - "libretro-common/encodings/encoding_rzstd.c"
          - "libretro-common/encodings/encoding_utf.c"
          - "libretro-common/features/features_cpu.c"
          - "libretro-common/file/file_path.c"
          - "libretro-common/file/file_path_io.c"
          - "libretro-common/file/retro_dirent.c"
          - "libretro-common/formats/7z/r7z_lzma.c"
          - "libretro-common/formats/chd/rchd.c"
          - "libretro-common/formats/data_transfer.c"
          - "libretro-common/formats/flac/rflac.c"
          - "libretro-common/formats/mp3/rmp3.c"
          - "libretro-common/formats/mpeg1/rmpeg1_ps.c"
          - "libretro-common/formats/mpeg1/rmpeg1_video.c"
          - "libretro-common/formats/vorbis/rvorbis.c"
          - "libretro-common/hash/lrc_hash.c"
          - "libretro-common/lists/dir_list.c"
