  # iOS; see SELibretroHost.mm). Cached interpreter on both platforms: WITH_DYNAREC unset (iOS forbids JIT),
  # HLE RSP; no ParaLLEl-RDP/RSP, angrylion or cxd4. System zlib replaces the bundled copy. Source list = upstream
