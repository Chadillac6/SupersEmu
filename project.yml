          - "pgxp/pgxp_mem.c"
          - "pgxp/pgxp_value.c"
          - "rhi/rhi_defer.c"
          - "rhi/rhi_intf.c"
    settings:
      base:
        <<: *core_settings
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "HAVE_PBP", "WANT_THREADING", "HAVE_THREADS", "NEED_DEINTERLACER", "WANT_32BPP", "NEED_CD", "HAVE_CHD", "HAVE_RCHD", "HAVE_RCHD_DEFLATE", "HAVE_RCHD_LZMA", "HAVE_RCHD_FLAC", "HAVE_RCHD_ZSTD", "HAVE_RFLAC", "HAVE_RZSTD", "MEDNAFEN_VERSION_NUMERIC=9386", "STDC_HEADERS", "__STDC_LIMIT_MACROS", "__STDC_CONSTANT_MACROS", "_LOW_ACCURACY_", "_FILE_OFFSET_BITS=64"]
        OTHER_CFLAGS: ["-fwrapv", "-fsigned-char"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/cores/beetle_psx"
          - "$(SRCROOT)/Vendor/cores/beetle_psx/mednafen"
          - "$(SRCROOT)/Vendor/cores/beetle_psx/mednafen/include"
          - "$(SRCROOT)/Vendor/cores/beetle_psx/libretro-common/include"
          - "$(SRCROOT)/Host/CoreEntry"

  SupersEmu:
    type: application
    platform: [iOS, macOS]
    sources:
      - App
      - path: Host
        excludes: ["CoreEntry/**"]
    dependencies:
      - target: Snes9xCore_${platform}
      - target: GambatteCore_${platform}
      - target: MGBACore_${platform}
      - target: GenesisPlusGXCore_${platform}
      - target: PicoDriveCore_${platform}
      - target: BeetlePSXCore_${platform}
      - sdk: libz.tbd
      - package: SupersEmuServer
        product: SupersEmuKit
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_NAME: SupersEmu
        PRODUCT_BUNDLE_IDENTIFIER: com.chadillac6.supersemu
        SWIFT_OBJC_BRIDGING_HEADER: Host/SupersEmu-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host/CoreEntry"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SupersEmu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "SupersEmu uses the camera to scan the pairing QR code from your SupersEmu Server."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SupersEmu finds and connects to your SupersEmu Server on your home network."
        # iOS only uses Apple's TLS (URLSession) and hashing: exempt. See docs/specs/distribution.md.
        "INFOPLIST_KEY_ITSAppUsesNonExemptEncryption[sdk=iphone*]": NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Merged with the generated Info.plist: keys that need arrays.
    info:
      path: Config/SupersEmu-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: ["_supersemu._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: com.chadillac6.supersemu.pair
            CFBundleURLSchemes: ["supersemu"]
    # macOS only (the script exits on iOS): embeds supersemu-server in Contents/MacOS and the launchd plist in
    # Contents/Library/LaunchDaemons for SMAppService.daemon.
    postBuildScripts:
      - name: Embed supersemu-server daemon
        script: '"$SRCROOT/scripts/embed-server-daemon.sh"'
        basedOnDependencyAnalysis: false

  SupersEmuHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/HostTests
      - Host/SELibretroHost.h
      - Host/SELibretroHost.mm
    dependencies:
      - target: Snes9xCore_macOS
      - target: GambatteCore_macOS
      - target: MGBACore_macOS
      - target: GenesisPlusGXCore_macOS
      - target: PicoDriveCore_macOS
      - target: BeetlePSXCore_macOS
      - sdk: libz.tbd
      - sdk: AVFoundation.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host", "$(SRCROOT)/Host/CoreEntry"]
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SupersEmu-macOS:
    build:
      targets:
        SupersEmu_macOS: all
        SupersEmuHostTests: [test]
    run:
      config: Debug
    test:
      targets: [SupersEmuHostTests]
  SupersEmu-iOS:
    build:
      targets:
        SupersEmu_iOS: all
    run:
      config: Debug
