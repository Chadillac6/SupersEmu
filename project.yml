        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphone*]": ["$(N64_DEFINES)", "IOS", "OS_IOS", "HAVE_OPENGLES", "HAVE_OPENGLES3", "GLES3"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Host/CoreEntry/Mupen64PlusNext"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/custom"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/custom/mupen64plus-core"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/custom/android/include"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/custom/GLideN64"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/GLideN64/src"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/GLideN64/src/osal"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/mupen64plus-core/src"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/mupen64plus-core/src/api"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/custom/mupen64plus-core/plugin/audio_libretro"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/libretro-common/include"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/libretro"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/GLideN64/src/inc"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/custom/dependencies/libpng"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/mupen64plus-core/subprojects/minizip"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/xxHash"
          - "$(SRCROOT)/Vendor/cores/mupen64plus_next/mupen64plus-core/subprojects/md5"
          - "$(SRCROOT)/Host/CoreEntry"

  SupersEmu:
    type: application
    platform: [iOS, macOS]
    sources:
      - App
      - path: Host
        excludes: ["CoreEntry/**"]
    dependencies:
      - target: Snes9xCore_${platform}
      - target: GambatteCore_${platform}
      - target: MGBACore_${platform}
      - target: GenesisPlusGXCore_${platform}
      - target: PicoDriveCore_${platform}
      - target: BeetlePSXCore_${platform}
      - target: Mupen64PlusNextCore_${platform}
      - sdk: libz.tbd
      - package: SupersEmuServer
        product: SupersEmuKit
      - package: Sparkle
        platforms: [macOS]
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_NAME: SupersEmu
        PRODUCT_BUNDLE_IDENTIFIER: com.chadillac6.supersemu
        SWIFT_OBJC_BRIDGING_HEADER: Host/SupersEmu-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host/CoreEntry"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SupersEmu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "SupersEmu uses the camera to scan the pairing QR code from your SupersEmu Server."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SupersEmu finds and connects to your SupersEmu Server on your home network."
        # iOS only uses Apple's TLS (URLSession) and hashing: exempt. See docs/specs/distribution.md.
        "INFOPLIST_KEY_ITSAppUsesNonExemptEncryption[sdk=iphone*]": NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    # Merged with the generated Info.plist: keys that need arrays.
    info:
      path: Config/SupersEmu-Info.plist
      properties:
        # The pinned, self-signed server is reached by Tailscale IP/MagicDNS, which ATS exception domains cannot express.
        # PinnedCertificateDelegate enforces pins; public URLs keep default trust handling.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(SUPERSEMU_UPDATE_FEED_URL)
        SUPublicEDKey: $(SUPERSEMU_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        NSBonjourServices: ["_supersemu._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: com.chadillac6.supersemu.pair
            CFBundleURLSchemes: ["supersemu"]
    # macOS only (the script exits on iOS): embeds supersemu-server in Contents/MacOS and the launchd plist in
    # Contents/Library/LaunchDaemons for SMAppService.daemon.
    postBuildScripts:
      - name: Embed supersemu-server daemon
        script: '"$SRCROOT/scripts/embed-server-daemon.sh"'
        basedOnDependencyAnalysis: false

  SupersEmuHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/HostTests
      - App/ServerMode/ServerMenuStatus.swift
      - App/Diagnostics/PerformanceStats.swift
      - App/Diagnostics/DiagnosticsLog.swift
      - App/Diagnostics/N64Preset.swift
      - Host/SELibretroHost.h
      - Host/SELibretroHost.mm
    dependencies:
      - package: SupersEmuServer
        product: SupersEmuKit
      - target: Snes9xCore_macOS
      - target: GambatteCore_macOS
      - target: MGBACore_macOS
      - target: GenesisPlusGXCore_macOS
      - target: PicoDriveCore_macOS
      - target: BeetlePSXCore_macOS
      - target: Mupen64PlusNextCore_macOS
      - sdk: libz.tbd
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host", "$(SRCROOT)/Host/CoreEntry"]
        GENERATE_INFOPLIST_FILE: YES

  SupersEmuInputTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/InputTests
      - App/Input/AutoStateCheckpoint.swift
      - App/Input/PadInput.swift
      - App/Saves/SaveSlotStore.swift
      - App/Saves/SaveSlotNavigator.swift
      - App/Input/TouchZones.swift
      - App/Input/ConsoleLayout.swift
      - App/Input/InputMapping.swift
      - App/Input/HIDReport.swift
      - App/Input/HIDPresets.swift
      - App/Input/PlayerChrome.swift
      - App/Input/TouchControlSizing.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SupersEmu-macOS:
    build:
      targets:
        SupersEmu_macOS: all
        SupersEmuHostTests: [test]
        SupersEmuInputTests: [test]
    run:
      config: Debug
    test:
      targets: [SupersEmuHostTests, SupersEmuInputTests]
  SupersEmu-iOS:
    build:
      targets:
        SupersEmu_iOS: all
    run:
      config: Debug
