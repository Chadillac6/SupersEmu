    settings:
      base:
        <<: *core_settings
        ARCHS: arm64
        USE_HEADERMAP: NO
        GCC_C_LANGUAGE_STANDARD: gnu99
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_ENABLE_CPP_EXCEPTIONS: NO
        GCC_ENABLE_CPP_RTTI: NO
        GCC_PREPROCESSOR_DEFINITIONS: ["__LIBRETRO__", "WANT_THREADING", "HAVE_THREADS", "FRONTEND_SUPPORTS_RGB565", "_ARCH_64=1", "VIXL_INCLUDE_TARGET_AARCH64", "VIXL_CODE_BUFFER_MALLOC", "HAVE_RCHD_DEFLATE", "HAVE_RCHD_LZMA", "HAVE_RCHD_FLAC", "HAVE_RCHD_ZSTD", "NDEBUG", "STDC_HEADERS", "_FILE_OFFSET_BITS=64", "__STDC_CONSTANT_MACROS", "__STDC_LIMIT_MACROS"]
        OTHER_CFLAGS: ["-fno-strict-aliasing"]
        OTHER_CPLUSPLUSFLAGS: ["$(OTHER_CFLAGS)", "-DPCSX2_C89_EMITTER", "-fvisibility-inlines-hidden"]
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/Vendor/cores/lrps2"
          - "$(SRCROOT)/Vendor/cores/lrps2/3rdparty"
          - "$(SRCROOT)/Vendor/cores/lrps2/3rdparty/include"
          - "$(SRCROOT)/Vendor/cores/lrps2/3rdparty/vixl/src"
          - "$(SRCROOT)/Vendor/cores/lrps2/3rdparty/xbyak"
          - "$(SRCROOT)/Vendor/cores/lrps2/common"
          - "$(SRCROOT)/Vendor/cores/lrps2/common/include"
          - "$(SRCROOT)/Vendor/cores/lrps2/libretro"
          - "$(SRCROOT)/Vendor/cores/lrps2/libretro/libretro-common/include"
          - "$(SRCROOT)/Vendor/cores/lrps2/pcsx2"
          - "$(SRCROOT)/Vendor/cores/lrps2/pcsx2/x86"
          - "$(SRCROOT)/Host/CoreEntry"

  SupersEmu:
    type: application
    platform: [iOS, macOS]
    sources:
      - App
      - path: Host
        excludes: ["CoreEntry/**"]
    dependencies:
      - target: Snes9xCore_${platform}
      - target: GambatteCore_${platform}
      - target: MGBACore_${platform}
      - target: GenesisPlusGXCore_${platform}
      - target: PicoDriveCore_${platform}
      - target: BeetlePSXCore_${platform}
      - target: Mupen64PlusNextCore_${platform}
      - target: FlycastCore_${platform}
      - target: LRPS2Core
        platforms: [macOS]
      - sdk: libz.tbd
      - package: SupersEmuServer
        product: SupersEmuKit
      - package: Sparkle
        platforms: [macOS]
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: GameController.framework
    settings:
      base:
        PRODUCT_NAME: SupersEmu
        PRODUCT_BUNDLE_IDENTIFIER: com.chadillac6.supersemu
        SWIFT_OBJC_BRIDGING_HEADER: Host/SupersEmu-Bridging-Header.h
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host/CoreEntry"]
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SupersEmu
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_GCSupportsControllerUserInteraction: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "SupersEmu uses the camera to scan the pairing QR code from your SupersEmu Server."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "SupersEmu finds and connects to your SupersEmu Server on your home network."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # iOS only uses Apple's TLS (URLSession) and hashing: exempt. See docs/specs/distribution.md.
        "INFOPLIST_KEY_ITSAppUsesNonExemptEncryption[sdk=iphone*]": NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # JIT for the Dreamcast and PS2 recompilers. iOS/TestFlight can't JIT, so iOS gets no entitlements file.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/SupersEmu-macOS.entitlements
    # Merged with the generated Info.plist: keys that need arrays.
    info:
      path: Config/SupersEmu-Info.plist
      properties:
        # LAN IPs and .local names reach the pinned self-signed server; the public host uses default WebPKI trust.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(SUPERSEMU_UPDATE_FEED_URL)
        SUPublicEDKey: $(SUPERSEMU_UPDATE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: true
        SUScheduledCheckInterval: 3600
        SUEnableSystemProfiling: false
        SUVerifyUpdateBeforeExtraction: true
        NSBonjourServices: ["_supersemu._tcp"]
        CFBundleURLTypes:
          - CFBundleURLName: com.chadillac6.supersemu.pair
            CFBundleURLSchemes: ["supersemu"]
    # macOS only (the script exits on iOS): embeds supersemu-server in Contents/MacOS and the launchd plist in
    # Contents/Library/LaunchDaemons for SMAppService.daemon.
    postBuildScripts:
      - name: Embed supersemu-server daemon
        script: '"$SRCROOT/scripts/embed-server-daemon.sh"'
        basedOnDependencyAnalysis: false

  SupersEmuHostTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/HostTests
      - App/ServerMode/ServerMenuStatus.swift
      - App/ServerMode/LocalServerConstants.swift
      - App/ServerMode/PrivilegedCommand.swift
      - App/ServerMode/UpdateStatus.swift
      - App/Diagnostics/PerformanceStats.swift
      - App/FramePacer.swift
      - App/AudioRateControl.swift
      - App/EmulationLoop.swift
      - App/Diagnostics/DiagnosticsLog.swift
      - App/Diagnostics/N64Preset.swift
      - App/Diagnostics/N64Graphics.swift
      - Host/SELibretroHost.h
      - Host/SELibretroHost.mm
    dependencies:
      - package: SupersEmuServer
        product: SupersEmuKit
      - target: Snes9xCore_macOS
      - target: GambatteCore_macOS
      - target: MGBACore_macOS
      - target: GenesisPlusGXCore_macOS
      - target: PicoDriveCore_macOS
      - target: BeetlePSXCore_macOS
      - target: Mupen64PlusNextCore_macOS
      - target: FlycastCore_macOS
      - target: LRPS2Core
      - sdk: libz.tbd
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host", "$(SRCROOT)/Host/CoreEntry"]
        SWIFT_OBJC_BRIDGING_HEADER: Host/SupersEmu-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES

  # iOS simulator run of the host tests: the same cores built without JIT, minus the Mac-only
  # server menu, updater and PS2 (LRPS2) tests.
  SupersEmuHostTests_iOS:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HostTests
        excludes:
          - PrivilegedCommandTests.swift
          - ServerMenuStatusTests.swift
          - UpdateStatusTests.swift
          - SELRPS2Tests.mm
      - App/Diagnostics/PerformanceStats.swift
      - App/FramePacer.swift
      - App/AudioRateControl.swift
      - App/EmulationLoop.swift
      - App/Diagnostics/DiagnosticsLog.swift
      - App/Diagnostics/N64Preset.swift
      - App/Diagnostics/N64Graphics.swift
      - Host/SELibretroHost.h
      - Host/SELibretroHost.mm
    dependencies:
      - package: SupersEmuServer
        product: SupersEmuKit
      - target: Snes9xCore_iOS
      - target: GambatteCore_iOS
      - target: MGBACore_iOS
      - target: GenesisPlusGXCore_iOS
      - target: PicoDriveCore_iOS
      - target: BeetlePSXCore_iOS
      - target: Mupen64PlusNextCore_iOS
      - target: FlycastCore_iOS
      - sdk: libz.tbd
      - sdk: AVFoundation.framework
      - sdk: CoreVideo.framework
      - sdk: CoreGraphics.framework
    settings:
      base:
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/Vendor/cores/snes9x/libretro", "$(SRCROOT)/Host", "$(SRCROOT)/Host/CoreEntry"]
        SWIFT_OBJC_BRIDGING_HEADER: Host/SupersEmu-Bridging-Header.h
        GENERATE_INFOPLIST_FILE: YES

  SupersEmuInputTests:
    type: bundle.unit-test
    platform: [iOS, macOS]
    sources:
      - Tests/InputTests
      - App/Diagnostics/AppLog.swift
      - App/Input/AutoStateCheckpoint.swift
      - App/Input/PadInput.swift
      - App/Saves/SaveSlotStore.swift
      - App/Saves/SaveSlotNavigator.swift
      - App/Input/TouchZones.swift
      - App/Input/ConsoleLayout.swift
      - App/Input/ControllerAssignments.swift
      - App/Input/InputMapping.swift
      - App/Input/HIDReport.swift
      - App/Input/HIDPresets.swift
      - App/Input/PlayerChrome.swift
      - App/Input/TouchControlSizing.swift
      - App/Client/SystemAvailability.swift
      - App/Client/LibraryShelves.swift
      - App/Game.swift
    dependencies:
      - package: SupersEmuServer
        product: SupersEmuKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SupersEmu-macOS:
    build:
      targets:
        SupersEmu_macOS: all
        SupersEmuHostTests: [test]
        SupersEmuInputTests_macOS: [test]
    run:
      config: Debug
    test:
      targets: [SupersEmuHostTests, SupersEmuInputTests_macOS]
  SupersEmu-iOS:
    build:
      targets:
        SupersEmu_iOS: all
        SupersEmuHostTests_iOS: [test]
        SupersEmuInputTests_iOS: [test]
    run:
      config: Debug
    test:
      targets: [SupersEmuHostTests_iOS, SupersEmuInputTests_iOS]
