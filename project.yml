    settings:
      base:
        <<: *core_settings
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_CXX_LANGUAGE_STANDARD: gnu++17
        # Several bundled deps ship same-named headers (zstd.h, config.h); search paths are per source group.
        USE_HEADERMAP: NO
        # zstd ships a module.modulemap that hides its static-linking API from its own sources.
        CLANG_ENABLE_MODULES: NO
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=macosx*]": ["NDEBUG", "TARGET_MAC", "HAVE_OPENGL"]
        "GCC_PREPROCESSOR_DEFINITIONS[sdk=iphone*]": ["NDEBUG", "TARGET_IPHONE", "IOS", "TARGET_NO_REC", "GLES", "GLES3", "GLES_SILENCE_DEPRECATION", "HAVE_OPENGLES", "HAVE_OPENGLES3"]
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*]": ["glsym_es3.c"]
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=macosx*][arch=x86_64]": ["glsym_es3.c", "assembler-aarch64.cc", "assembler-sve-aarch64.cc", "code-buffer-vixl.cc", "compiler-intrinsics-vixl.cc", "cpu-features.cc", "instructions-aarch64.cc", "macro-assembler-aarch64.cc", "macro-assembler-sve-aarch64.cc", "operands-aarch64.cc", "pointer-auth-aarch64.cc", "registers-aarch64.cc", "utils-vixl.cc"]
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphone*]": ["glsym_gl.c"]
        "EXCLUDED_SOURCE_FILE_NAMES[sdk=iphone*][arch=x86_64]": ["glsym_gl.c", "assembler-aarch64.cc", "assembler-sve-aarch64.cc", "code-buffer-vixl.cc", "compiler-intrinsics-vixl.cc", "cpu-features.cc", "instructions-aarch64.cc", "macro-assembler-aarch64.cc", "macro-assembler-sve-aarch64.cc", "operands-aarch64.cc", "pointer-auth-aarch64.cc", "registers-aarch64.cc", "utils-vixl.cc"]

  # PlayStation 2 (macOS, Apple Silicon only). LRPS2 (libretro PCSX2) with its native arm64 EE/IOP/VU
  # recompilers (MAP_JIT + pthread_jit_write_protect_np via libretro-common memjit_*; needs the allow-jit
  # entitlement) and the software GS renderer ("Software (SW)"): no OpenGL/Vulkan (HAVE_OPENGL=0 HAVE_VULKAN=0).
  # Source list = upstream Makefile/Makefile.common for `make platform=osx arch=arm64 HAVE_OPENGL=0 HAVE_VULKAN=0`.
  # arm64 only: the x86_64 slice of a universal Mac build has no PS2 core (CoreRegistry/kCores are arm64-gated).
  LRPS2Core:
    type: library.static
    platform: macOS
    preBuildScripts:
      - name: Generate LRPS2 game database
        basedOnDependencyAnalysis: true
        inputFiles:
          - $(SRCROOT)/Vendor/cores/lrps2/bin/resources/GameIndex.yaml
          - $(SRCROOT)/Vendor/cores/lrps2/tools/gen_gamedb_builtin.sh
        outputFiles:
          - $(SRCROOT)/Vendor/cores/lrps2/pcsx2/GameDatabaseBuiltin.c
        script: |
          cd "$SRCROOT/Vendor/cores/lrps2"
          sh tools/gen_gamedb_builtin.sh bin/resources/GameIndex.yaml pcsx2/GameDatabaseBuiltin.c
    sources:
      - path: Host/CoreEntry/SECoreEntry.c
        compilerFlags: ["-DSE_CORE_ID=lrps2", "-DSE_CORE_REVISION=3053b13", "-DSE_CORE_LOAD_GAME=se_lrps2_load_game", "-DSE_CORE_RUN=se_lrps2_run", "-DSE_CORE_DEINIT=se_lrps2_deinit", "-DSE_CORE_GET_MEMORY_DATA=se_lrps2_get_memory_data", "-DSE_CORE_GET_MEMORY_SIZE=se_lrps2_get_memory_size"]
      # Memory card 1 as save RAM, so PS2 saves are kept and synced per game ID.
      - path: Host/CoreEntry/lrps2
      # Generated before compiling (gitignored upstream): the game-compatibility database as a C array.
      - path: Vendor/cores/lrps2/pcsx2/GameDatabaseBuiltin.c
        optional: true
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/Common/GSVertexTrace.c
        compilerFlags: ["-ffp-contract=off"]
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/Common/GSVertexTraceFMM.c
        compilerFlags: ["-ffp-contract=off"]
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/SW/GSDeviceSW.cpp
        compilerFlags: ["-ffp-contract=off"]
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/SW/GSDrawScanline.cpp
        compilerFlags: ["-ffp-contract=off"]
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/SW/GSRasterizer.cpp
        compilerFlags: ["-ffp-contract=off"]
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/SW/GSRendererSW.cpp
        compilerFlags: ["-ffp-contract=off"]
      - path: Vendor/cores/lrps2/pcsx2/GS/Renderers/SW/GSTextureCacheSW.cpp
