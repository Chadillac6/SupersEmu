name: Fleet CI and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
  # Only cache explicitly licensed fixtures; leave SNES and the N64 bootcode out.
  TEST_ROM_CACHE_PATHS: |
    Tests/Fixtures/local/dmg-acid2.gb
    Tests/Fixtures/local/cgb-acid2.gbc
    Tests/Fixtures/local/gba-tests-hello.gba
    Tests/Fixtures/local/mega-drive-midi-interface.md
    Tests/Fixtures/local/chroma-circuit.elf
    Tests/Fixtures/local/chroma-circuit.cdi
    Tests/Fixtures/local/noudar.32x
permissions:
  contents: read
concurrency:
  group: fleet-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  supersede:
    name: Supersede stale main runs
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    permissions:
      actions: write
      contents: read
      statuses: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        id: checkout
        continue-on-error: true
        with:
          persist-credentials: false
      - name: Check for a queued replacement
        if: steps.checkout.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-supersede-fleet.sh
  mac_server:
    name: Test Mac app and server
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test fixture fetcher
        run: bash scripts/test-fetch-test-roms.sh
      - name: Restore cached homebrew test fixtures
        id: test_roms
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TEST_ROM_CACHE_PATHS }}
          key: test-roms-${{ hashFiles('scripts/fetch-test-roms.sh') }}
      - name: Fetch and verify homebrew test fixtures
        id: fixture_fetch
        run: scripts/fetch-test-roms.sh ${{ github.event_name == 'pull_request' && '--require-all' || '--allow-missing' }}
      - name: Save verified homebrew test fixtures
        if: github.ref == 'refs/heads/main' && steps.fixture_fetch.outputs.cache_ready == 'true' && steps.test_roms.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TEST_ROM_CACHE_PATHS }}
          key: ${{ steps.test_roms.outputs.cache-primary-key }}
      - name: Prepare build tools and pinned cores
        run: |
          brew install xcodegen
          git submodule update --init --depth 1
          git -C Vendor/cores/picodrive submodule update --init --depth 1 platform/libpicofe platform/common/dr_libs pico/sound/emu2413
          git -C Vendor/cores/flycast submodule update --init --depth 1 core/deps/libchdr core/deps/tinygettext core/deps/xbyak core/deps/asio
          xcodegen generate
      - name: Test release signing scripts
        run: |
          scripts/test-release-mac-staple-retry.sh
          scripts/test-release-mac-trim-derived-data.sh
          scripts/test-release-mac-dmg-size.sh
          scripts/test-ci-wait-for-job.sh
          bash scripts/test-ci-retry-testflight.sh
          bash scripts/test-ci-retry-fleet-pr.sh
          bash scripts/test-ci-supersede-fleet.sh
          scripts/test-release-gatekeeper-check.sh
          scripts/test-release-p12.sh
          scripts/test-release-revoke-dev-certs.sh
          scripts/test-marketing-version.sh
          scripts/test-mac-release-notes.sh
      - name: Test remote access scripts
        run: |
          scripts/test-ddns-cloudflare.sh
          scripts/test-public-access.sh
      - name: Test server
        run: swift test --package-path Server
      - name: Test Mac app
        run: xcodebuild test -project SupersEmu.xcodeproj -scheme SupersEmu-macOS -destination 'platform=macOS' -derivedDataPath build/ci -resultBundlePath build/ci-tests.xcresult CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=YES
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-test-results
          path: build/ci-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
  ios_simulator:
    name: Build and test iOS app
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Restore cached homebrew test fixtures
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: ${{ env.TEST_ROM_CACHE_PATHS }}
          key: test-roms-${{ hashFiles('scripts/fetch-test-roms.sh') }}
      - name: Fetch and verify homebrew test fixtures
        run: scripts/fetch-test-roms.sh ${{ github.event_name == 'pull_request' && '--require-all' || '--allow-missing' }}
      - name: Prepare build tools and pinned cores
        run: |
          brew install xcodegen
          git submodule update --init --depth 1
          git -C Vendor/cores/picodrive submodule update --init --depth 1 platform/libpicofe platform/common/dr_libs pico/sound/emu2413
          git -C Vendor/cores/flycast submodule update --init --depth 1 core/deps/libchdr core/deps/tinygettext core/deps/xbyak core/deps/asio
          xcodegen generate
      - name: Restore Swift packages
        id: swift_packages
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: build/ci-ios/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('Server/Package.resolved', 'project.yml') }}
          # Keep the existing exact-input cache warm on its original toolchain during rollout.
          restore-keys: |
            ios-spm-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-
            ${{ runner.os == 'macOS' && runner.arch == 'ARM64' && env.DEVELOPER_DIR == '/Applications/Xcode_26.2.app/Contents/Developer' && format('ios-spm-{0}', hashFiles('Server/Package.resolved', 'project.yml')) || '' }}
      - name: Build iOS app and tests
        run: |
          xcodebuild build-for-testing -project SupersEmu.xcodeproj -scheme SupersEmu-iOS \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/ci-ios \
            -showBuildTimingSummary ARCHS="$(uname -m)" COMPILER_INDEX_STORE_ENABLE=NO
      - name: Save Swift packages for future runs
        if: github.ref == 'refs/heads/main' && steps.swift_packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: build/ci-ios/SourcePackages
          key: ${{ steps.swift_packages.outputs.cache-primary-key }}
      - name: Pick and boot iPhone and iPad simulators
        id: simulators
        run: |
          scripts/test-ci-ios-simulators.sh
          scripts/ci-ios-simulators.sh >> "$GITHUB_OUTPUT"
      - name: Test iOS app on iPhone and iPad
        env:
          IPHONE: ${{ steps.simulators.outputs.iphone }}
          IPAD: ${{ steps.simulators.outputs.ipad }}
        run: |
          test_runs=(build/ci-ios/Build/Products/*.xctestrun)
          if [[ ${#test_runs[@]} -ne 1 || ! -f "${test_runs[0]}" ]]; then
            echo 'Expected exactly one .xctestrun file from the iOS build' >&2
            exit 1
          fi
          xcodebuild test-without-building -xctestrun "${test_runs[0]}" \
            -destination "id=$IPHONE" -destination "id=$IPAD" -resultBundlePath build/ci-ios-tests.xcresult
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ios-test-results
          path: build/ci-ios-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore
  checks:
    name: Mac and server checks
    needs: [mac_server, ios_simulator]
    if: >-
      ${{ always() && !(cancelled() && github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.run_attempt == '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both checks to pass
        env:
          MAC_SERVER_RESULT: ${{ needs.mac_server.result }}
          IOS_SIMULATOR_RESULT: ${{ needs.ios_simulator.result }}
        run: |
          printf 'Mac and server: %s\niOS: %s\n' "$MAC_SERVER_RESULT" "$IOS_SIMULATOR_RESULT"
          [[ "$MAC_SERVER_RESULT" == success && "$IOS_SIMULATOR_RESULT" == success ]]
  # Release jobs build alongside the checks and publish only after they pass (ci-wait-for-job.sh).
  version:
    name: Select release version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 15
    environment: mac-release
    env:
      SUPERSEMU_TEAM_ID: '967UEY5R3M'
    outputs:
      marketing-version: ${{ steps.select.outputs.marketing-version }}
      build-number: ${{ steps.select.outputs.build-number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select shared version and build number
        id: select
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          brew install xcodegen
          version="$(scripts/release-version.sh)"
          build_number="$(date -u +%Y%m%d.%H%M%S)"
          echo "marketing-version=$version" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Version $version (build $build_number)"
  release:
    name: Publish Mac update
    needs: version
    runs-on: macos-15
    timeout-minutes: 150
    environment: mac-release
    permissions:
      actions: read
      contents: write
      statuses: write
    env:
      SUPERSEMU_TEAM_ID: '967UEY5R3M'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare isolated signing keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/ci-signing.sh
      - name: Use shared version and build number
        env:
          MARKETING_VERSION: ${{ needs.version.outputs.marketing-version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
        run: |
          brew install xcodegen
          echo "SUPERSEMU_MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "SUPERSEMU_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Version $MARKETING_VERSION (build $BUILD_NUMBER)"
      - name: Build and notarize universal Mac release
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: scripts/release-mac.sh
      - name: Wait for Mac, server, and iOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-wait-for-job.sh 'Test Mac app and server' 'Build and test iOS app'
      - name: Check for newer main commit
        id: latest-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-fleet-publish-guard.sh
      - name: Publish signed Sparkle update
        if: steps.latest-commit.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-mac-update.sh "build/release-mac/$SUPERSEMU_BUILD_NUMBER" "mac-$SUPERSEMU_BUILD_NUMBER" "$GITHUB_SHA"
      - name: Remove temporary signing credentials
        if: always()
        run: scripts/ci-signing.sh cleanup
  testflight:
    name: Upload iOS build to TestFlight
    needs: version
    runs-on: macos-15
    timeout-minutes: 150
    environment: mac-release
    permissions:
      actions: read
      contents: read
      statuses: write
    env:
      SUPERSEMU_TEAM_ID: '967UEY5R3M'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated signing keychain
        env:
          MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/ci-signing.sh
      - name: Use shared version and build number
        env:
          MARKETING_VERSION: ${{ needs.version.outputs.marketing-version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build-number }}
        run: |
          brew install xcodegen
          echo "SUPERSEMU_MARKETING_VERSION=$MARKETING_VERSION" >> "$GITHUB_ENV"
          echo "SUPERSEMU_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "Version $MARKETING_VERSION (build $BUILD_NUMBER)"
      - name: Archive iOS app
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SUPERSEMU_IOS_STAGE: archive
        run: scripts/release-ios.sh
      - name: Wait for Mac, server, and iOS checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-wait-for-job.sh 'Test Mac app and server' 'Build and test iOS app'
      - name: Check for newer main commit
        id: latest-commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci-fleet-publish-guard.sh
      - name: Upload iOS build to TestFlight
        if: steps.latest-commit.outputs.publish == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          SUPERSEMU_IOS_STAGE: upload
        run: scripts/release-ios.sh
      - name: Remove temporary signing credentials
        if: always()
        run: scripts/ci-signing.sh cleanup
